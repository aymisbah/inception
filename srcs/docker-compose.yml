version: "3.8"

services:
  nginx:
    build: requirements/ngnix/.
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./web:/var/www/html
    depends_on:
      - mariadb

  wordpress:
    build: requirements/wordpress/.
    container_name: wp-php
    volumes:
      - ./web:/var/www/html
    depends_on:
      - mariadb


  mariadb:
    build: requirements/mariadb/.
    container_name: mariadb

