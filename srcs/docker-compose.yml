services:
  nginx:
    build: requirements/ngnix/.
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - mariadb
    networks:
      inception:

  wordpress:
    env_file:
      - .env
    build: requirements/wordpress/.
    container_name: wp-php
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - mariadb
    networks:
      inception:
    secrets:
      - db_password
      - wp_admin_password

  mariadb:
    env_file:
      - .env
    build: requirements/mariadb/.
    container_name: mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      inception:
    secrets:
      - db_password

networks:
  inception:

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aymisbah/data/wordpress

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aymisbah/data/mariadb

secrets:
  db_password:
    file: ./secrets/db_pass.txt

  wp_admin_password:
    file: ./secrets/admin_wp.txt
